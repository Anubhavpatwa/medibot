<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediBot AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#020817;
    color:white;
    overflow:hidden;
}

.app{
    display:flex;
    height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:300px;
    background:#071226;
    padding:20px;
    border-right:1px solid #1e3a5f;
}

.logo{
    font-size:34px;
    font-weight:bold;
    color:#3b82f6;
    margin-bottom:40px;
}

.doctor-card{
    display:flex;
    align-items:center;
    gap:15px;
    background:#0d1b34;
    padding:15px;
    border-radius:18px;
    margin-bottom:18px;
    cursor:pointer;
    transition:.3s;
    border:2px solid transparent;
}

.doctor-card:hover{
    border:2px solid #2563eb;
}

.active{
    border:2px solid #2563eb;
    box-shadow:0 0 20px #2563eb55;
}

.doctor-card img{
    width:60px;
    height:60px;
    border-radius:50%;
}

.doctor-card h3{
    margin-bottom:5px;
}

.doctor-card p{
    color:#94a3b8;
    font-size:14px;
}

/* CHAT */

.chat-section{
    flex:1;
    display:flex;
    flex-direction:column;
}

.chat-top{
    padding:20px;
    border-bottom:1px solid #1e3a5f;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.doctor-info{
    display:flex;
    align-items:center;
    gap:15px;
}

.doctor-info img{
    width:70px;
    height:70px;
    border-radius:50%;
}

.online-dot{
    background:#16a34a;
    padding:10px 18px;
    border-radius:30px;
}

#chatBox{
    flex:1;
    padding:30px;
    overflow-y:auto;
}

.message{
    margin-bottom:20px;
    display:flex;
}

.user{
    justify-content:flex-end;
}

.bot{
    justify-content:flex-start;
}

.bubble{
    max-width:60%;
    padding:18px;
    border-radius:18px;
    line-height:1.7;
}

.user .bubble{
    background:#2563eb;
}

.bot .bubble{
    background:#0f172a;
}

.input-area{
    display:flex;
    gap:10px;
    padding:20px;
    border-top:1px solid #1e3a5f;
}

.input-area input{
    flex:1;
    padding:18px;
    border:none;
    border-radius:14px;
    background:#0f172a;
    color:white;
    font-size:16px;
}

.input-area button{
    padding:18px 30px;
    border:none;
    border-radius:14px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

/* RIGHT PANEL */

.right-panel{
    width:320px;
    background:#071226;
    border-left:1px solid #1e3a5f;
    padding:20px;
}

.upload-box,
.camera-box{
    background:#0d1b34;
    padding:20px;
    border-radius:18px;
    margin-bottom:20px;
}

.upload-box h3,
.camera-box h3{
    margin-bottom:15px;
}

.upload-box input{
    width:100%;
    margin-bottom:15px;
}

.upload-box button,
.camera-box button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#7c3aed;
    color:white;
    cursor:pointer;
}

video{
    width:100%;
    border-radius:12px;
    margin-top:15px;
}

</style>

</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            MEDIBOT
        </div>

        <div class="doctor-card active"
        onclick="selectDoctor(this,'Skin Specialist')">

            <img src="https://cdn-icons-png.flaticon.com/512/387/387561.png">

            <div>
                <h3>Skin Specialist</h3>
                <p>Dermatologist</p>
            </div>

        </div>

        <div class="doctor-card"
        onclick="selectDoctor(this,'Neuro Specialist')">

            <img src="https://cdn-icons-png.flaticon.com/512/3774/3774299.png">

            <div>
                <h3>Neuro Specialist</h3>
                <p>Neurologist</p>
            </div>

        </div>

        <div class="doctor-card"
        onclick="selectDoctor(this,'Heart Specialist')">

            <img src="https://cdn-icons-png.flaticon.com/512/2966/2966480.png">

            <div>
                <h3>Heart Specialist</h3>
                <p>Cardiologist</p>
            </div>

        </div>

        <div class="doctor-card"
        onclick="selectDoctor(this,'Gynecologist')">

            <img src="https://cdn-icons-png.flaticon.com/512/4320/4320371.png">

            <div>
                <h3>Gynecologist</h3>
                <p>Women Specialist</p>
            </div>

        </div>
<div class="doctor-card" onclick="selectDoctor(this,'Medical Expert')">

    <img src="https://cdn-icons-png.flaticon.com/512/2966/2966486.png">

    <div>

        <h3>Medical Expert</h3>

        <p>General AI Doctor</p>

    </div>

</div>
    </div>

    <!-- CHAT -->

    <div class="chat-section">

        <div class="chat-top">

            <div class="doctor-info">

                <img
                id="doctorImage"
                src="https://cdn-icons-png.flaticon.com/512/387/387561.png">

                <div>

                    <h2 id="doctorTitle">
                        Skin Specialist
                    </h2>

                    <p id="doctorRole">
                        Dermatologist
                    </p>

                </div>

            </div>

            <div class="online-dot">
                Online
            </div>

        </div>

        <div id="chatBox">

            <div class="message bot">

                <div class="bubble">
                    Hello 👋 <br><br>
                    Ask your medical questions.
                </div>

            </div>

        </div>

        <div class="input-area">

           
            <input
            type="text"
            id="message"
            placeholder="Ask your medical question...">

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

    <!-- RIGHT PANEL -->

    <div class="right-panel">

        <div class="upload-box">

            <h3>📷 Upload Disease Image</h3>

            <input type="file" id="imageFile" accept="image/*">
            
            <button onclick="uploadImage()">
             Analyze Image
            </button>

        </div>

        <div class="upload-box">

            <h3>📄 Upload Medical PDF</h3>

            <input type="file" id="pdfFile">
            <input 
                type="text"
                id="pdfQuestion"
                placeholder="Ask about report..."
                class="pdf-question"
            />
            <button onclick="uploadPDF()">
              Analyze Report
            </button>

        </div>



    </div>

</div>

<script>

let currentDoctor = "Skin Specialist";

const doctorsData = {

    "Skin Specialist": {
        image:"https://cdn-icons-png.flaticon.com/512/387/387561.png",
        role:"Dermatologist",
        welcome:"Hello 👋 I am your Skin Specialist."
        
    },

    "Neuro Specialist": {
        image:"https://cdn-icons-png.flaticon.com/512/3774/3774299.png",
        role:"Neurologist",
        welcome:"Hello 👋 I am your Neuro Specialist."
    },
"Heart Specialist": {

    image:"https://cdn-icons-png.flaticon.com/512/2966/2966480.png",

    role:"Cardiologist",

    welcome:"Hello 👋 I am your Heart Specialist."

},

"Gynecologist": {

    image:"https://cdn-icons-png.flaticon.com/512/4320/4320371.png",

    role:"Women Specialist",

    welcome:"Hello 👋 I am your Gynecologist."

},
    "Medical Expert": {

        image:"https://cdn-icons-png.flaticon.com/512/2785/2785482.png",

        role:"General AI Doctor",

        welcome:"Hello 👋 I am your Medical Expert AI Assistant."

    }

};

function selectDoctor(element,doctor){

    currentDoctor = doctor;

    let data = doctorsData[doctor];

    document.querySelectorAll(".doctor-card")
    .forEach(card=>{

        card.classList.remove("active");

    });

    element.classList.add("active");

    document.getElementById("doctorTitle")
    .innerText = doctor;

    document.getElementById("doctorRole")
    .innerText = data.role;

    document.getElementById("doctorImage")
    .src = data.image;

    document.getElementById("chatBox").innerHTML = `

    <div class="message bot">

        <div class="bubble">

            ${data.welcome}

        </div>

    </div>

    `;
}

async function sendMessage(){
   
    let input =
    document.getElementById("message");

    let message =
    input.value;

    if(message.trim() === ""){

        return;

    }

    let chatBox =
    document.getElementById("chatBox");

    // USER MESSAGE

    chatBox.innerHTML += `

    <div class="message user">

        <div class="bubble">

            ${message}

        </div>

    </div>

    `;

    input.value = "";

    // LOADING

    chatBox.innerHTML += `

    <div class="message bot" id="loading">

        <div class="bubble">

            AI is thinking...

        </div>

    </div>

    `;

    chatBox.scrollTop =
    chatBox.scrollHeight;

    try{

        let response = await fetch('/chat/',{

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify({

                message:message,
                doctor:currentDoctor

            })

        });

        let data = await response.json();

        // REMOVE LOADING

        document.getElementById("loading").remove();

        // BOT RESPONSE

        chatBox.innerHTML += `

        <div class="message bot">

            <div class="bubble">

                ${data.reply
                   .replace(/\*\*/g, "")
                   .replace(/\n/g, "<br>")
                 }

            </div>

        </div>

        `;

        chatBox.scrollTop =
        chatBox.scrollHeight;

    }

    catch(error){

        console.log(error);

        document.getElementById("loading").remove();

        chatBox.innerHTML += `

        <div class="message bot">

            <div class="bubble">

                Server Error...

            </div>

        </div>

        `;
    }
}
async function uploadPDF(){

    let fileInput =
    document.getElementById("pdfFile");

    let file =
    fileInput.files[0];

    if(!file){

        alert("Please select PDF");

        return;

    }

    let formData =
    new FormData();
    formData.append("pdf", file);
    let question =
    document.getElementById("pdfQuestion").value;
    formData.append("question", question);

    let response = await fetch('/analyze-pdf/',{

        method:'POST',

        body:formData

    });

    let data =
    await response.json();

    let chatBox =
    document.getElementById("chatBox");

    chatBox.innerHTML += `

    <div class="message bot">

        <div class="bubble">

            ${data.reply}

        </div>

    </div>

    `;
}
async function uploadImage(){

    let fileInput =
    document.getElementById("imageFile");

    let file =
    fileInput.files[0];

    if(!file){

        alert("Please select image");

        return;

    }

    let formData =
    new FormData();

    formData.append("image", file);

    let response = await fetch('/analyze-image/',{

        method:'POST',

        body:formData
    });

    let data =
    await response.json();

    let chatBox =
    document.getElementById("chatBox");

    chatBox.innerHTML += `

    <div class="message bot">

        <div class="bubble">

            ${data.reply
                .replace(/\*\*/g, "")
                .replace(/\n/g, "<br>")}

        </div>

    </div>
    `;
}
document.getElementById("message")
.addEventListener("keypress", function(event){

    if(event.key === "Enter"){

        sendMessage();

    }

});
</script>
</body>
</html>
